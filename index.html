<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Materiały — adam-studiuje</title>
<meta name="description" content="Darmowe materiały o nauce i o studiach medycznych. Bez zapisów, bez maila — po prostu pobierz.">

<meta property="og:title" content="Materiały — adam-studiuje">
<meta property="og:description" content="Darmowe materiały o nauce i o studiach medycznych. Bez zapisów, bez maila.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0E0D0B">
<meta name="color-scheme" content="dark">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

<style>
:root{
  --tlo:#0E0D0B;
  --tlo-podniesione:#141310;
  --tlo-hover:#1A1814;
  --kratka:#1F1D18;
  --tekst:#F0EBE2;
  --tekst-cichy:#8F877A;
  --amber:#E8A33D;
  --amber-jasny:#F5C46B;
  --linia:#2A2721;

  --serif:"DejaVu Serif","Noto Serif",Georgia,serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;

  --siatka:32px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}

body{
  background:var(--tlo);
  color:var(--tekst);
  font-family:var(--serif);
  font-size:17px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  padding:0 22px;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
  position:relative;
  min-height:100vh;
}

/* kratka — papier milimetrowy pod całą stroną */
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  background-image:
    linear-gradient(to right,var(--kratka) 1px,transparent 1px),
    linear-gradient(to bottom,var(--kratka) 1px,transparent 1px);
  background-size:var(--siatka) var(--siatka);
  -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 20%,transparent 85%);
  mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 20%,transparent 85%);
}

.otoczka{max-width:620px;margin:0 auto;position:relative;z-index:1}

/* ---------- nagłówek ---------- */

.szczyt{padding:64px 0 44px}

.podpis{
  font-family:var(--sans);
  font-size:11.5px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--amber);
  font-weight:600;
  margin-bottom:20px;
}

.szczyt h1{
  font-size:33px;
  line-height:1.24;
  font-weight:700;
  letter-spacing:-.015em;
  margin-bottom:18px;
}

.szczyt h1 em{
  font-style:italic;
  font-weight:400;
  color:var(--amber-jasny);
}

.wstep{
  color:var(--tekst-cichy);
  font-size:17px;
  max-width:44ch;
}

/* ---------- sekcje ---------- */

.dzial{padding-bottom:52px}

.dzial-glowa{
  border-left:2px solid var(--amber);
  padding-left:16px;
  margin-bottom:26px;
}

.dzial-glowa .etykieta{
  font-family:var(--sans);
  font-size:11px;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--amber);
  font-weight:600;
  display:block;
  margin-bottom:5px;
}

.dzial-glowa h2{
  font-size:21px;
  font-weight:600;
  line-height:1.35;
  margin-bottom:4px;
}

.dzial-glowa p{
  font-size:15px;
  color:var(--tekst-cichy);
  line-height:1.55;
}

/* ---------- karty ---------- */

.stos{display:flex;flex-direction:column;gap:14px}

.karta{
  display:block;
  text-decoration:none;
  color:inherit;
  background:var(--tlo-podniesione);
  border:1px solid var(--linia);
  border-radius:3px;
  padding:22px 22px 20px;
  position:relative;
  z-index:1;
  transition:border-color .18s ease,background-color .18s ease,transform .18s ease;
}

.karta:hover,.karta:focus-visible{
  border-color:var(--amber);
  background:var(--tlo-hover);
  transform:translateY(-1px);
}

.karta:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

.karta h3{
  font-size:19px;
  font-weight:600;
  line-height:1.35;
  margin-bottom:8px;
  padding-right:56px;
}

.karta .opis{
  font-size:15.5px;
  color:var(--tekst-cichy);
  line-height:1.58;
  margin-bottom:16px;
}

.stopka-karty{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  border-top:1px solid var(--linia);
  padding-top:13px;
}

.meta{
  font-family:var(--sans);
  font-size:11px;
  letter-spacing:.13em;
  text-transform:uppercase;
  color:var(--tekst-cichy);
  font-weight:600;
}

.akcja{
  font-family:var(--sans);
  font-size:11px;
  font-weight:600;
  letter-spacing:.13em;
  text-transform:uppercase;
  color:var(--amber);
  white-space:nowrap;
}

.akcja span{
  display:inline-block;
  transition:transform .18s ease;
  margin-left:4px;
}

.karta:hover .akcja span{transform:translateX(3px)}

.znacznik{
  position:absolute;
  top:20px;
  right:20px;
  font-family:var(--sans);
  font-size:11px;
  font-weight:700;
  letter-spacing:.13em;
  text-transform:uppercase;
  color:var(--amber);
  border:1px solid var(--amber);
  border-radius:2px;
  padding:2px 8px;
}

/* ---------- stopka ---------- */

.spod{
  border-top:1px solid var(--linia);
  padding-top:30px;
  margin-top:8px;
}

.spod p{
  font-size:17px;
  color:var(--tekst-cichy);
  margin-bottom:18px;
  max-width:42ch;
}

.spod a.wroc{
  font-family:var(--sans);
  font-size:11.5px;
  font-weight:600;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--tekst);
  text-decoration:none;
  border-bottom:2px solid var(--amber);
  padding-bottom:3px;
  transition:color .18s ease;
}

.spod a.wroc:hover{color:var(--amber)}
.spod a.wroc:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

/* ---------- wejście ---------- */

.wchodzi{opacity:0;transform:translateY(10px);animation:pojaw .5s ease forwards}
@keyframes pojaw{to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .wchodzi{opacity:1;transform:none}
}

@media (min-width:640px){
  .szczyt{padding:88px 0 56px}
  .szczyt h1{font-size:41px}
}
</style>
</head>
<body>

<div class="otoczka" id="korzen"></div>

<script>
/* ══════════════════════════════════════════════════════════════
   KONFIGURACJA — jedyne miejsce, które edytujesz.

   Nowy materiał = jeden obiekt w "pozycje".
   Pola: tytul, opis, meta, plik, nowe (opcjonalne)
   PDF wrzucasz do folderu /pliki i podajesz ścieżkę.
   ══════════════════════════════════════════════════════════════ */

const KONFIG = {
  instagram: "https://instagram.com/adam_studiuje",
  nick: "@adam_studiuje",

  naglowek: "Wszystko, co <em>rozdaję za darmo</em>",
  wstep: "Materiały, które piszę przy okazji własnej nauki na medycynie. Bez zapisów, bez maila — klikasz i masz.",

  dzialy: [
    {
      etykieta: "Metoda",
      tytul: "Jak się uczyć",
      opis: "Rzeczy, których nikt nie tłumaczy, a decydują o tym, ile zostaje po sesji.",
      pozycje: [
        {
          tytul: "Mity o nauce i o I roku",
          opis: "Sześć przekonań, w które prawdopodobnie uwierzyłeś, i pytania do siebie przy każdym z nich.",
          meta: "PDF",
          plik: "mity_1.pdf",
          nowe: true
        },
        {
          tytul: "Jak uzależnić się od nauki",
          opis: "O budowaniu nawyku, który nie rozpada się w trzecim tygodniu.",
          meta: "PDF",
          plik: "nawyk.pdf"
        },
        {
          tytul: "Gdzie się uczysz, ma znaczenie",
          opis: "Pamięć zależna od kontekstu — co mówią badania i co z tego wynika dla twojego biurka.",
          meta: "PDF",
          plik: "kontekst.pdf"
        }
      ]
    }
  ],

  stopka: "Jeśli coś z tego było przydatne — napisz mi, który fragment. Czytam każdą wiadomość.",
  cta: "Napisz na Instagramie"
};

/* ══════════════════════════════════════════════════════════════
   Poniżej nie trzeba nic zmieniać.
   ══════════════════════════════════════════════════════════════ */

function bezpieczny(tekst){
  const d = document.createElement("div");
  d.textContent = tekst;
  return d.innerHTML;
}

function kartaHTML(p){
  const znacznik = p.nowe ? '<span class="znacznik">Nowe</span>' : "";
  return `
    <a class="karta" href="${bezpieczny(p.plik)}" target="_blank" rel="noopener">
      ${znacznik}
      <h3>${bezpieczny(p.tytul)}</h3>
      <p class="opis">${bezpieczny(p.opis)}</p>
      <div class="stopka-karty">
        <span class="meta">${bezpieczny(p.meta || "PDF")}</span>
        <span class="akcja">Otwórz<span>&rarr;</span></span>
      </div>
    </a>`;
}

function dzialHTML(d){
  const karty = (d.pozycje || []).map(kartaHTML).join("");
  return `
    <section class="dzial">
      <div class="dzial-glowa">
        <span class="etykieta">${bezpieczny(d.etykieta)}</span>
        <h2>${bezpieczny(d.tytul)}</h2>
        <p>${bezpieczny(d.opis)}</p>
      </div>
      <div class="stos">${karty}</div>
    </section>`;
}

document.getElementById("korzen").innerHTML = `
  <header class="szczyt">
    <div class="podpis">${bezpieczny(KONFIG.nick)}</div>
    <h1>${KONFIG.naglowek}</h1>
    <p class="wstep">${bezpieczny(KONFIG.wstep)}</p>
  </header>
  ${KONFIG.dzialy.map(dzialHTML).join("")}
  <footer class="spod">
    <p>${bezpieczny(KONFIG.stopka)}</p>
    <a class="wroc" href="${bezpieczny(KONFIG.instagram)}" target="_blank" rel="noopener">${bezpieczny(KONFIG.cta)} &rarr;</a>
  </footer>
`;

document.querySelectorAll(".szczyt, .dzial, .spod").forEach((el, i) => {
  el.classList.add("wchodzi");
  el.style.animationDelay = (i * 70) + "ms";
});
</script>

</body>
</html>
